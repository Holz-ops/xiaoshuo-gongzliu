<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>章纲分两条线：先行章纲与总结章纲</title>
<desc>先行章纲在写作前定下并冻结，正文按它扩写；写完后按实际内容总结出总结章纲；两条一对比得出偏差，后续写下一批、排下一卷都以总结章纲为准。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="60" y="48" width="240" height="58" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="180" y="70" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">先行章纲（写之前定）</text>
<text x="180" y="90" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">冻结，一个字都不许改</text>
<rect x="380" y="48" width="240" height="58" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="500" y="70" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">正文</text>
<text x="500" y="90" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">照先行章纲一句句扩写</text>
<path d="M303 77 L377 77" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="380" y="152" width="240" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="500" y="174" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489" font-family="sans-serif">总结章纲（写完后总结）</text>
<text x="500" y="194" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7" font-family="sans-serif">按实际发生的事重写一遍</text>
<path d="M500 106 L500 149" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="152" width="240" height="58" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="180" y="174" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A" font-family="sans-serif">两条一比 = 偏差</text>
<text x="180" y="194" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-family="sans-serif">新增 / 删除 / 挪位</text>
<path d="M180 106 L180 149" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M377 181 L303 181" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="140" y="248" width="400" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="267" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041" font-family="sans-serif">后续一律以「总结章纲」为准</text>
<text x="340" y="286" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-family="sans-serif">写下一批 · 排下一卷 · 复查对照</text>
<path d="M180 210 L180 230 L340 230 L340 245" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M500 210 L500 230 L340 230" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
</svg>
