<svg viewBox="0 0 680 306" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>章纲回填：用正文实际内容重写章纲</title>
<desc>章纲先写计划，正文按计划写，写完用实际内容回填章纲，产出准确的章纲与计划实际偏差记录，供后续章节、下一卷和复查使用。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="60" y="48" width="250" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="66" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">5 章纲：计划要发生什么</text>
<text x="185" y="85" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">写之前的设想要点</text>
<rect x="370" y="48" width="250" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="495" y="66" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">6 正文：实际写出来的</text>
<text x="495" y="85" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">一定会跟计划有出入</text>
<path d="M313 74 L367 74" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495 100 L495 118 L340 118 L340 137" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="170" y="140" width="340" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489" font-family="sans-serif">章纲回填（本批写完就做）</text>
<text x="340" y="179" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7" font-family="sans-serif">按实际发生的事重写章纲 + 记下偏差</text>
<path d="M340 196 L340 214 L180 214 L180 229" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 196 L340 214 L500 214 L500 229" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="232" width="280" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="180" y="251" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041" font-family="sans-serif">后续章节与下一卷</text>
<text x="180" y="269" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="sans-serif">照着准确的章纲接，不会断</text>
<rect x="360" y="232" width="280" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="251" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041" font-family="sans-serif">复查的对照材料</text>
<text x="500" y="269" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="sans-serif">计划与实际差在哪，一眼可见</text>
</svg>
